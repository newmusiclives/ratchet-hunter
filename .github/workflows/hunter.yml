name: Hunter daily paper run

on:
  schedule:
    # 22:17 UTC = 3:17 pm Arizona / New Mexico winter time, Monday-Friday (after the US market closes)
    - cron: "17 22 * * 1-5"
  workflow_dispatch: {}   # "Run workflow" button for a manual run

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: hunter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.site.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests beautifulsoup4

      - name: Run the Hunter
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALLOW_REAL_MONEY: ${{ secrets.ALLOW_REAL_MONEY }}
          GITHUB_TOKEN: ${{ github.token }}
          HUNTER_SITE: "1"
        run: python hunter.py run

      - name: Save the paper account for tomorrow
        run: |
          git config user.name "ratchet-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git commit -m "Paper run $(date -u +%F)" || echo "Nothing new to save"
          # catch up with any newer code before saving (e.g. the monthly refresh ran first)
          ok=0
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && ok=1 && break
            sleep 5
          done
          if [ "$ok" != 1 ]; then echo "Could not save to GitHub"; exit 1; fi

      - name: Build the web page
        id: site
        run: python build_site.py | tee /tmp/site.txt && grep -o "publish=.*" /tmp/site.txt >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.publish == 'true'
        with:
          path: site

      - name: Tell a human if anything failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Hunter run failed on $(date -u +%F)" \
            --body "Today's run did not finish. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  deploy:
    needs: run
    if: needs.run.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
